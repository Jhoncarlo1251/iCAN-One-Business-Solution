server:
  port: ${PORT:4000}
  error:
    include-message: never
spring:
  application:
    name: ican-java-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ican}
    username: ${DATABASE_USER:ican}
    password: ${DATABASE_PASSWORD:ican_dev_only}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
ican:
  jwt-secret: ${JWT_SECRET:}
  jwt-ttl-minutes: ${JWT_TTL_MINUTES:60}
  cors-origins: ${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
