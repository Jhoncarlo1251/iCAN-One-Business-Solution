# Hosted database variant: uses Supabase PostgreSQL and does not start a local PostgreSQL container.
# Configure DATABASE_URL and PGSSL=true in your private root .env before starting.
name: ican-one-business-solution-supabase
services:
  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: "1"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the Supabase PostgreSQL connection string}
      PGSSL: ${PGSSL:-true}
      PGPOOL_MAX: ${PGPOOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 characters in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set exact trusted HTTPS origin(s) in .env}
      PAYMONGO_MODE: ${PAYMONGO_MODE:-test}
      PAYMONGO_SECRET_KEY: ${PAYMONGO_SECRET_KEY:-}
      PAYMONGO_WEBHOOK_SECRET_TEST: ${PAYMONGO_WEBHOOK_SECRET_TEST:-}
      PAYMONGO_WEBHOOK_SECRET_LIVE: ${PAYMONGO_WEBHOOK_SECRET_LIVE:-}
      PAYMONGO_PAYMENT_METHOD_TYPES: ${PAYMONGO_PAYMENT_METHOD_TYPES:-card,gcash,qrph}
      PAYMENT_RETURN_URL: ${PAYMENT_RETURN_URL:?Set PAYMENT_RETURN_URL in .env}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      MISTRAL_API_URL: ${MISTRAL_API_URL:-https://api.mistral.ai/v1/chat/completions}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-ican-files}
    networks: [edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./manifest.webmanifest:/usr/share/nginx/html/manifest.webmanifest:ro
      - ./service-worker.js:/usr/share/nginx/html/service-worker.js:ro
      - ./src:/usr/share/nginx/html/src:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    networks: [edge]
networks:
  edge: {}
