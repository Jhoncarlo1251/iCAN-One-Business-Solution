services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ican
      POSTGRES_USER: ican
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes: [ican_java_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ican -d ican"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  java-api:
    build: ./backend-java
    environment:
      PORT: 4000
      DATABASE_URL: jdbc:postgresql://postgres:5432/ican
      DATABASE_USER: ican
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ random characters)}
      JWT_TTL_MINUTES: 60
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports: ["4000:4000"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
volumes:
  ican_java_pgdata:
